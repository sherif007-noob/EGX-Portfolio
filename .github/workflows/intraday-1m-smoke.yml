name: Intraday 1m ACTF NAPR Depth Probe

on:
  push:
    branches:
      - feature/premium-ui-redesign
    paths:
      - '.github/workflows/intraday-1m-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: egx-intraday-1m-smoke
  cancel-in-progress: false

jobs:
  sync:
    name: Probe ACTF and NAPR at 20000 bars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automation configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Probe ACTF and NAPR at 20k one-minute bars
        env:
          EGX_1M_DIAGNOSTIC_TICKERS: ACTF,NAPR
          EGX_1M_DIAGNOSTIC_BAR_COUNT: '20000'
        run: npm run diagnose:intraday:1m
