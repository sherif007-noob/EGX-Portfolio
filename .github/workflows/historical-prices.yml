name: Historical Prices

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma-separated tickers to repair (blank = auto-detect all gaps)'
        required: false
        type: string
      start_date:
        description: 'Optional YYYY-MM-DD lower-bound override'
        required: false
        type: string
      end_date:
        description: 'Optional YYYY-MM-DD end-date override'
        required: false
        type: string
  schedule:
    # Gap-aware sync is cheap when coverage is healthy: it exits before opening
    # a TradingView session. Run after/around the EGX close and through the
    # evening so newly-added/backdated trades do not wait until the next day.
    - cron: '17 12-22 * * *'

permissions:
  contents: read

concurrency:
  group: egx-historical-prices
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automation configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Repair TradingView historical price coverage
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EGX_PORTFOLIO_ID: ${{ vars.EGX_PORTFOLIO_ID }}
          EGX_HISTORY_TICKERS: ${{ inputs.tickers }}
          EGX_HISTORY_START: ${{ inputs.start_date }}
          EGX_HISTORY_END: ${{ inputs.end_date }}
        run: npm run sync:historical
