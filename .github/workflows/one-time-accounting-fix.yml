name: One-time accounting fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[accounting-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply authoritative ledger fixes
        run: python scripts/one_time_accounting_fix.py
      - name: Commit surgical accounting fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/usePortfolioState.ts src/services/firestoreStorage.ts src/services/portfolioReconciliation.test.ts src/App.tsx .github/workflows/one-time-accounting-fix.yml scripts/one_time_accounting_fix.py
          git diff --cached --check
          git commit -m "Fix authoritative ledger mutations and OCR batches [accounting-fix]"
          git push origin main
