name: One-time Execution Timestamp Fix

on:
  push:
    paths:
      - 'scripts/one_time_execution_timestamp_fix.py'
      - '.github/workflows/one-time-execution-timestamp-fix.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply execution timestamp changes
        run: python scripts/one_time_execution_timestamp_fix.py
