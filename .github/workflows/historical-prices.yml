name: Historical Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 0-4'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Sync TradingView historical prices
        env:
          EGX_FIREBASE_EMAIL: ${{ secrets.EGX_FIREBASE_EMAIL }}
          EGX_FIREBASE_PASSWORD: ${{ secrets.EGX_FIREBASE_PASSWORD }}
        run: npm run sync:historical
