name: EGX Live Session Soak

on:
  workflow_dispatch:
    inputs:
      session_date:
        description: 'Cairo EGX session date (YYYY-MM-DD)'
        required: false
        default: '2026-10-05'
        type: string
      now_override:
        description: 'Optional ISO timestamp for diagnostics only'
        required: false
        type: string
  schedule:
    # One-session Stage 3.5 retry for Monday 2026-10-05.
    # Cairo is UTC+3 on this date.
    - cron: '45 6 5 10 *'  # 09:45 Cairo — pre-open baseline
    - cron: '20 7 5 10 *'  # 10:20 Cairo — early session
    - cron: '0 9 5 10 *'   # 12:00 Cairo — mid-session
    - cron: '20 11 5 10 *' # 14:20 Cairo — near close
    - cron: '20 12 5 10 *' # 15:20 Cairo — post-grace strict verdict

permissions:
  contents: read

concurrency:
  group: egx-live-session-soak
  cancel-in-progress: false

jobs:
  observe:
    name: Read-only production session observation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production truth
        uses: actions/checkout@v4

      - name: Validate soak configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Observe live production session
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EGX_PORTFOLIO_ID: ${{ vars.EGX_PORTFOLIO_ID }}
          EGX_PRODUCTION_URL: https://egx-portfolio.sherif-nader07.workers.dev
          EGX_LIVE_SOAK_DATE: ${{ inputs.session_date || '2026-10-05' }}
          EGX_LIVE_SOAK_NOW: ${{ inputs.now_override || '' }}
          EGX_LIVE_SOAK_OUTPUT: live-session-soak.json
        run: npm run verify:live-session-soak

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-session-soak-${{ github.run_number }}-${{ github.run_attempt }}
          path: live-session-soak.json
          if-no-files-found: warn
          retention-days: 14
