name: Legacy Intraday 5m Repair

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma-separated tickers for targeted legacy repair'
        required: false
        type: string
      bar_count:
        description: 'Optional TradingView 5m bar count override'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: egx-intraday-market-data
  cancel-in-progress: true

jobs:
  sync:
    name: Manual legacy TradingView 5m repair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automation configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run manual legacy 5-minute repair
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EGX_PORTFOLIO_ID: ${{ vars.EGX_PORTFOLIO_ID }}
          EGX_INTRADAY_RETENTION_DAYS: '90'
          EGX_INTRADAY_TICKERS: ${{ inputs.tickers }}
          EGX_INTRADAY_BAR_COUNT: ${{ inputs.bar_count }}
        run: npm run sync:intraday
