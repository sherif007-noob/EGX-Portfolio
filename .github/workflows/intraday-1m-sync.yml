name: Intraday 1m Sync

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Optional comma-separated tickers (blank = session-relevant portfolio universe)'
        required: false
        type: string
      full_repair:
        description: 'Force the deepest available 1m bootstrap and rebuild reconstructible derived 5m history'
        required: false
        default: false
        type: boolean
  # Stage 3.5 remediation: production scheduling moved to Supabase pg_cron
  # + egx-intraday-scheduler Edge Function. This workflow is manual-only and
  # remains available for deep repair / operator diagnostics.

permissions:
  contents: read

# All production intraday writers share this group. Never introduce a second
# writer-specific group for a workflow that persists intraday bars.
concurrency:
  group: egx-intraday-market-data
  cancel-in-progress: false

jobs:
  sync:
    name: Sync raw 1m and derived 5m
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automation configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync TradingView 1-minute history and derive 5-minute history
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EGX_PORTFOLIO_ID: ${{ vars.EGX_PORTFOLIO_ID }}
          EGX_INTRADAY_TICKERS: ${{ inputs.tickers }}
          EGX_INTRADAY_FULL_REPAIR: ${{ inputs.full_repair }}
          EGX_INTRADAY_SCHEDULED: 'false'
        run: npm run sync:intraday:1m
