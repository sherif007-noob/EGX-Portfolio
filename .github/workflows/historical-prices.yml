name: Historical Prices

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 0-4'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automation configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Sync TradingView historical prices
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EGX_PORTFOLIO_ID: ${{ vars.EGX_PORTFOLIO_ID }}
        run: bun run sync:historical
