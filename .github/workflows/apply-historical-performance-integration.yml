name: Apply historical performance integration

on:
  push:
    branches:
      - historical-performance-integration

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: historical-performance-integration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply historical performance bridge
        run: python3 scripts/applyHistoricalPerformanceIntegration.py

      - name: Install dependencies
        run: |
          yarn install --non-interactive --no-progress
          yarn add --non-interactive --no-progress --ignore-workspace-root-check react-is@^19.0.0

      - name: Typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Commit verified integration
        run: |
          rm .github/workflows/apply-historical-performance-integration.yml
          rm scripts/applyHistoricalPerformanceIntegration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/apply-historical-performance-integration.yml scripts/applyHistoricalPerformanceIntegration.py
          git commit -m "fix: connect historical drawdown to performance reports"
          git push origin HEAD:historical-performance-integration
