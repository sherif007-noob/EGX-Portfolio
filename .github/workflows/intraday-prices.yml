name: Intraday Prices

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/intraday-prices.yml'
      - 'scripts/syncIntradayPrices.ts'
  schedule:
    # Broad UTC window covers the EGX session across Cairo DST changes.
    # TradingView supplies the actual 15-minute bar timestamps; the cron time
    # only determines how often we ingest newly completed/current bars.
    - cron: '*/15 6-13 * * 0-4'

permissions:
  contents: read

concurrency:
  group: egx-intraday-prices
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate automation configuration
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is not configured in repository Actions secrets."
            exit 1
          fi
          case "$SUPABASE_SECRET_KEY" in
            sb_secret_*) ;;
            *)
              echo "::error::SUPABASE_SECRET_KEY must be a current sb_secret_ server key."
              exit 1
              ;;
          esac

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync TradingView 15-minute prices
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EGX_PORTFOLIO_ID: ${{ vars.EGX_PORTFOLIO_ID }}
          EGX_INTRADAY_RETENTION_DAYS: '90'
        run: npm run sync:intraday
