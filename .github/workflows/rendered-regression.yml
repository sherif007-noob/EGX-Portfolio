name: Rendered Visual Regression

# Golden baselines are mandatory after bootstrap; missing baselines are allowed only for the one-time promotion run.

on:
  push:
    branches:
      - main
      - ci/stage4-5-3-2-2-2-5-rendered-gate
    paths:
      - 'src/**'
      - 'scripts/renderedRegression.mjs'
      - 'visual-regression/baseline/**'
      - '.github/workflows/rendered-regression.yml'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egx-rendered-visual-regression
  cancel-in-progress: true

jobs:
  rendered:
    name: Chromium screenshot matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm
        run: npm install --global npm@11.6.0

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build deterministic visual-regression app
        env:
          VITE_VISUAL_REGRESSION: 'true'
        run: npm run build:cloudflare

      - name: Start Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/egx-visual-preview.log 2>&1 &
          echo $! > /tmp/egx-visual-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/egx-visual-preview.log
          exit 1

      - name: Capture and compare browser states
        env:
          VISUAL_BASE_URL: http://127.0.0.1:4173
          VISUAL_REQUIRE_BASELINE: ${{ hashFiles('visual-regression/baseline/*.png') != '' && 'true' || 'false' }}
          VISUAL_MAX_DIFF_RATIO: '0.01'
          VISUAL_CHANNEL_TOLERANCE: '16'
        run: node scripts/renderedRegression.mjs

      - name: Promote first inspected golden baseline
        if: ${{ github.event_name == 'push' && hashFiles('visual-regression/baseline/*.png') == '' }}
        run: |
          mkdir -p visual-regression/baseline
          cp visual-regression/current/*.png visual-regression/baseline/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-regression/baseline
          git commit -m "test: establish rendered visual baselines"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-visual-regression
          if-no-files-found: warn
          retention-days: 14
          path: |
            visual-regression/current/**
            visual-regression/diff/**
            visual-regression/report.json
            /tmp/egx-visual-preview.log
