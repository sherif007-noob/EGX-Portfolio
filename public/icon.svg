<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Pyramid / Market Peak Silhouette Base -->
  <path d="M 120 370 L 256 160 L 392 370 Z" fill="#0f172a" stroke="#334155" stroke-width="3" opacity="0.6"/>
  <path d="M 256 160 L 392 370 L 256 370 Z" fill="#1e293b" opacity="0.4"/>

  <!-- Candlesticks behind trend -->
  <!-- Candle 1 -->
  <line x1="160" y1="280" x2="160" y2="350" stroke="#059669" stroke-width="4"/>
  <rect x="150" y="295" width="20" height="40" rx="3" fill="#059669"/>

  <!-- Candle 2 -->
  <line x1="220" y1="240" x2="220" y2="320" stroke="#059669" stroke-width="4"/>
  <rect x="210" y="255" width="20" height="45" rx="3" fill="#059669"/>

  <!-- Candle 3 -->
  <line x1="280" y1="210" x2="280" y2="290" stroke="#10b981" stroke-width="4"/>
  <rect x="270" y="220" width="20" height="50" rx="3" fill="#10b981"/>

  <!-- Candle 4 -->
  <line x1="340" y1="170" x2="340" y2="260" stroke="#10b981" stroke-width="4"/>
  <rect x="330" y="180" width="20" height="60" rx="3" fill="#10b981"/>

  <!-- Ascending Dynamic Curve / Cycle Arrow -->
  <path d="M 110 340 Q 200 330 250 250 T 390 150" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Arrow Head -->
  <polygon points="390,135 410,155 385,168" fill="#fef08a"/>

  <!-- Pulse Node -->
  <circle cx="250" cy="250" r="8" fill="#fef08a"/>

  <!-- EGX Badge label -->
  <rect x="180" y="395" width="152" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="256" y="420" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="4" text-anchor="middle">EGX 30</text>
</svg>
