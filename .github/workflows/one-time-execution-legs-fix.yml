name: One-time Execution Legs Fix

on:
  push:
    paths:
      - 'scripts/one_time_execution_legs_fix.py'
      - '.github/workflows/one-time-execution-legs-fix.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply execution leg provenance fix
        run: python scripts/one_time_execution_legs_fix.py
      - name: Remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/one_time_execution_legs_fix.py .github/workflows/one-time-execution-legs-fix.yml
          git commit -m 'chore: remove one-time execution legs fix'
          git push
