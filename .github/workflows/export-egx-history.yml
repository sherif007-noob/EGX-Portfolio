name: Export EGX Historical Universe
# rerun after TradingView bar-count fix
on:
  push:
    branches: [egx-history-universe-export]
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Export TradingView history
        env:
          EGX_HISTORY_START: 2026-09-01
          EGX_HISTORY_END: 2026-09-18
        run: bun run tsx scripts/exportEgxHistory.ts
      - uses: actions/upload-artifact@v4
        with:
          name: egx-history-export
          path: egx-history-export.json
          retention-days: 1
