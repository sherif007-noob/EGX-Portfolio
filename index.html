<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Clean up any stale service worker from dev environment
      if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function() {});
      }
      // Suppress benign Vite HMR websocket connection errors in container preview
      if (typeof window !== 'undefined') {
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? String(e.reason) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('vite') !== -1) {
            e.preventDefault();
          }
        });
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#091428" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EGX Tracker" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>EGX Portfolio Tracker</title>
    <meta name="description" content="Progressive web app to track EGX stock portfolios and performance indicators with Google Sheets and schema sync." />
    <meta property="og:title" content="EGX Portfolio Tracker" />
    <meta property="og:description" content="Progressive web app to track EGX stock portfolios and performance indicators with Google Sheets and schema sync." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
