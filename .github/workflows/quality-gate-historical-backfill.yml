name: Quality Gate Historical Backfill

on:
  push:
    branches:
      - production-quality-gate-backfill-run

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh dependency lock
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Upload refreshed lockfile
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-bun-lock
          path: bun.lock

      - name: Backfill historical prices
        env:
          SUPABASE_URL: https://jhubsrbfiqjxdgngnwaq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FIREBASE_ADMIN_OWNER_UID: ${{ secrets.FIREBASE_ADMIN_OWNER_UID }}
        run: bun run sync:historical
